server:
  port: 8080

spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            scope:
              - email
              - profile
              - openid
  application:
    name: backend-core
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dapcode_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123123}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:K7vQ8zP2mR4wX9yL1tN5bC0fG3jH6kE8sA1dF4gJ7hL=}
  expiration-ms: 86400000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  admin:
    username: ${ADMIN_DEFAULT_USERNAME:dapcode_admin}
    email: ${ADMIN_DEFAULT_EMAIL:admin@dapcode.io}
    password: ${ADMIN_DEFAULT_PASSWORD:admin123}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/auth/callback}
