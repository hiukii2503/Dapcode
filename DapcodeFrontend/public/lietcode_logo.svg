<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="3" y="3" width="94" height="94" rx="24" fill="url(#bgGrad)" stroke="#FFA116" stroke-width="2.5" stroke-opacity="0.6"/>
  <rect x="5" y="5" width="90" height="90" rx="22" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Wheelchair Main Wheel (Large back wheel) -->
  <circle cx="44" cy="62" r="19" fill="none" stroke="url(#goldGrad)" stroke-width="4.5"/>
  <circle cx="44" cy="62" r="6.5" fill="#2A2A2A" stroke="url(#goldGrad)" stroke-width="3"/>
  <!-- Wheel Spokes -->
  <line x1="44" y1="45" x2="44" y2="79" stroke="#FFA116" stroke-width="2" stroke-opacity="0.75"/>
  <line x1="27" y1="62" x2="61" y2="62" stroke="#FFA116" stroke-width="2" stroke-opacity="0.75"/>
  <line x1="32" y1="50" x2="56" y2="74" stroke="#FFA116" stroke-width="1.8" stroke-opacity="0.6"/>
  <line x1="32" y1="74" x2="56" y2="50" stroke="#FFA116" stroke-width="1.8" stroke-opacity="0.6"/>

  <!-- Wheelchair Frame & Seat Structure -->
  <!-- Backrest bar -->
  <path d="M 33 39 L 41 55 L 59 55" fill="none" stroke="#EFF1F6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front frame to small caster wheel -->
  <path d="M 59 55 L 68 73" fill="none" stroke="#EFF1F6" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Small front wheel -->
  <circle cx="68" cy="77" r="4.5" fill="#FFA116" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Programmer Person -->
  <!-- Head with Headphones -->
  <circle cx="44" cy="25" r="7.5" fill="#EFF1F6"/>
  <!-- Headphone Band & Ear Cups -->
  <path d="M 38 25 C 38 18 50 18 50 25" fill="none" stroke="#FFA116" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="36.5" y="23" width="3" height="5" rx="1.5" fill="#FFA116"/>
  <rect x="48.5" y="23" width="3" height="5" rx="1.5" fill="#FFA116"/>

  <!-- Body / Torso (Leaning forward into the code) -->
  <path d="M 43 32 L 42 45 L 58 47" fill="none" stroke="#EFF1F6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arms typing on laptop -->
  <path d="M 43 38 L 57 44 L 67 43" fill="none" stroke="#FFA116" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Laptop on lap -->
  <!-- Laptop base -->
  <line x1="58" y1="46" x2="76" y2="46" stroke="#E6E6E6" stroke-width="3" stroke-linecap="round"/>
  <!-- Laptop glowing display screen -->
  <line x1="72" y1="45" x2="79" y2="33" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Glowing Code bracket on the screen < / > -->
  <path d="M 72 37 L 70 39 L 72 41" fill="none" stroke="#00E5FF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 75 37 L 77 39 L 75 41" fill="none" stroke="#00E5FF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
